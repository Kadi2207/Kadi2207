<title id="t">Du besoin à la solution</title>
<desc id="d">Schéma en quatre étapes, avec des particules qui circulent entre elles. 1, Données : 397 884 lignes de transactions (e-commerce), 5 234 contacts (RevOps). 2, Nettoyage : fiabilisation des données (Consulat du Mali), audit qualité avant migration (RevOps). 3, Modèle ou analyse : TF-IDF + Random Forest (TCIM), analyse des processus (Consulat du Mali), LLMs via l'API Hugging Face (WMDP). 4, Dashboard : Streamlit + Plotly, KPIs et reporting pour la direction.</desc>
