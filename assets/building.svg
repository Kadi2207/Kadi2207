<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d">
<title id="t">En construction</title>
<desc id="d">En construction. TCIM / Skills4Mind (depuis avril 2026) : Partie IA : classification automatique de données de santé. 3 couches (règles, ML, arbitre), accuracy de 82,5 %. RGPD / RBAC, chiffrement Fernet (AES-128 CBC + HMAC-SHA256). Présentation du projet sur demande. Portfolio + assistant chatbot IA (en cours) : Développé avec Claude Code. Connecté à une API de modèle de langage. Lien à venir.</desc>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(400px)}}.dot{animation:pulse 1.6s ease-in-out infinite}.sg{transform:translateX(200px);animation:slide 2.4s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#2c5282"/></linearGradient><clipPath id="tr"><rect width="520" height="6" rx="3"/></clipPath></defs>
<rect width="600" height="470" rx="14" fill="url(#g)"/>
<rect width="8" height="470" fill="#c8901a"/>
<circle class="dot" cx="38" cy="36" r="6" fill="#c8901a"/>
<text x="54" y="42" font-size="21" font-weight="700" fill="#ffffff" style="font-family:'Segoe UI', Calibri, Arial, sans-serif">En construction</text>
