<g transform="translate(30 96)"><rect width="520" height="6" rx="3" fill="#ffffff" opacity=".18"/><g clip-path="url(#tr)"><rect class="sg" width="120" height="6" rx="3" fill="#c8901a"/></g></g>
<rect x="30" y="121" width="7" height="7" fill="#c8901a"/><text x="46" y="130" font-size="15" fill="#e6edf5" style="font-family:'Segoe UI', Calibri, Arial, sans-serif">Partie IA : classification automatique de données de santé</text>
